[project]
name = "moltkit"
version = "0.2.1"
description = "A complete wrapper around the Moltbook API for AI agents — No more @someone."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "风 (Feng)", email = "feng@fengtrace.me" },
]
requires-python = ">=3.10"

[project.scripts]
moltkit = "moltkit_cli.main:main"
moltkit-mcp = "moltkit_mcp.server:main"

[project.optional-dependencies]
cli = ["typer>=0.12"]
mcp = ["mcp>=1.0"]

[project.urls]
homepage = "https://github.com/fengtrace/moltkit"
repository = "https://github.com/fengtrace/moltkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
moltkit = ["py.typed"]
